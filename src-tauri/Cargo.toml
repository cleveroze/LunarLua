[package]
name = "lunarlua"
version = "1.0.0"
description = "LunarLua - Lua/Luau obfuscator and deobfuscator"
authors = ["cleveroze"]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
arboard = "3"
mlua = { version = "0.10", features = ["lua51", "vendored"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
